name: Build fixed Hysteria pcsproxy4 release identity

on:
  push:
    branches: [pcs/udp-resolution-context]
    paths:
      - '.github/workflows/pcsproxy4-release.yml'
      - 'tools/pcsproxy4-release/**'

permissions:
  contents: read

concurrency:
  group: pcsproxy4-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'justinchen13/hysteria' && github.ref == 'refs/heads/pcs/udp-resolution-context'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          architecture: x64
          check-latest: false
          cache: false
      - name: Build only the reviewed formal identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          test "$(realpath "$GITHUB_WORKSPACE/dist")" = "$GITHUB_WORKSPACE/dist"
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          log="$RUNNER_TEMP/pcsproxy4-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          set +e
          sudo /usr/bin/env "PATH=$PATH" "GITHUB_ACTIONS=true" \
            "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" "GITHUB_REF=$GITHUB_REF" \
            "GITHUB_SHA=$GITHUB_SHA" "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            bash tools/pcsproxy4-release/launch-remote.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" >"$RUNNER_TEMP/pcsproxy4-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.exit"
          exit "$status"
      - name: Preserve exact result and failure records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/dist/pcsproxy4-release"
          sudo mkdir -p "$output"
          test "$(sudo realpath "$output")" = "$output"
          test -z "$(sudo find "$output" -type l -print -quit)"
          sudo chown -R --no-dereference "$(id -u):$(id -g)" "$output"
          for suffix in log exit; do
            input="$RUNNER_TEMP/pcsproxy4-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.$suffix"
            if test -f "$input"; then cp "$input" "$output/workflow-execution.$suffix"; fi
          done
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']);out=root/'dist/pcsproxy4-release'
          paths=['.github/workflows/pcsproxy4-release.yml','tools/pcsproxy4-release/build.py',
                 'tools/pcsproxy4-release/launch-remote.sh','tools/pcsproxy4-release/source-manifest.json',
                 'tools/pcsproxy4-release/plan.json','tools/pcsproxy4-release/sources.template.json',
                 'tools/pcs-udp-resolution-context/actions-lock.json']
          info={'origin':'REMOTE_CI_RELEASE_BUILD_ONLY','repository':os.environ['GITHUB_REPOSITORY'],
                'ref':os.environ['GITHUB_REF'],'commit':os.environ['GITHUB_SHA'],
                'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'files_sha256':{}}
          for name in paths:
              data=(root/name).read_bytes();info['files_sha256'][name]=hashlib.sha256(data).hexdigest()
              (out/('input-'+pathlib.Path(name).name)).write_bytes(data)
          (out/'workflow-provenance.json').write_text(json.dumps(info,indent=2)+'\n')
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n'
              for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          PY
      - name: Retain exact formal artifact including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hy-pcsproxy4-linux-amd64-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/pcsproxy4-release/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
          include-hidden-files: false
